[package]
name = "base-evm2"
description = "evm2 execution type family for base"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
evm2.workspace = true
alloy-consensus.workspace = true
alloy-eips.workspace = true
alloy-primitives.workspace = true
alloy-sol-types.workspace = true

# base: pinned to the same foundry-rs/base revision Foundry uses so the types unify.
base-common-consensus = { git = "https://github.com/foundry-rs/base", rev = "2aa8bc46e6b4272ef3bf0905e1a5660ee2525e72", default-features = false, features = ["std"] }
base-common-eip8130 = { git = "https://github.com/foundry-rs/base", rev = "2aa8bc46e6b4272ef3bf0905e1a5660ee2525e72", default-features = false, features = ["std"] }
base-common-genesis = { git = "https://github.com/foundry-rs/base", rev = "2aa8bc46e6b4272ef3bf0905e1a5660ee2525e72", default-features = false, features = ["std"] }
base-common-l1-fees = { git = "https://github.com/foundry-rs/base", rev = "2aa8bc46e6b4272ef3bf0905e1a5660ee2525e72", default-features = false, features = ["std"] }

# base: the Beryl B-20 factory, token, and policy registry business logic, run through an
# evm2-backed `PrecompileStorageProvider`. These crates pull revm in, but only revm data types
# (account info, bytecode, journal checkpoints) cross the provider boundary: revm never executes.
base-common-precompiles = { git = "https://github.com/foundry-rs/base", rev = "2aa8bc46e6b4272ef3bf0905e1a5660ee2525e72", default-features = false, features = ["std"] }
base-precompile-storage = { git = "https://github.com/foundry-rs/base", rev = "2aa8bc46e6b4272ef3bf0905e1a5660ee2525e72", default-features = false, features = ["std"] }
base-execution-eip8130 = { git = "https://github.com/foundry-rs/base", rev = "2aa8bc46e6b4272ef3bf0905e1a5660ee2525e72", default-features = false }
revm = { version = "43.0.0", default-features = false, features = ["std"] }

[dev-dependencies]
# base: the revm execution path, used as the source of truth by the differential parity tests.
base-common-chains = { git = "https://github.com/foundry-rs/base", rev = "2aa8bc46e6b4272ef3bf0905e1a5660ee2525e72", default-features = false, features = ["std"] }
base-common-evm = { git = "https://github.com/foundry-rs/base", rev = "2aa8bc46e6b4272ef3bf0905e1a5660ee2525e72", default-features = false, features = ["std", "optional_balance_check", "optional_fee_charge", "optional_no_base_fee"] }
k256 = { version = "0.14", features = ["ecdsa"] }
alloy-evm = { version = "0.39", default-features = false, features = ["std"] }
