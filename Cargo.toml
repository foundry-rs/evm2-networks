[workspace]
members = ["crates/op", "crates/base", "crates/monad", "crates/arbitrum"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
authors = ["Mablr <59505383+mablr@users.noreply.github.com>"]
license = "MIT OR Apache-2.0"
homepage = "https://github.com/mablr/evm2-networks"
repository = "https://github.com/mablr/evm2-networks"
keywords = ["evm", "evm2", "ethereum", "execution"]
categories = ["cryptography::cryptocurrencies"]
publish = false

[workspace.lints.clippy]
dbg_macro = "warn"
manual_string_new = "warn"
uninlined_format_args = "warn"
use_self = "warn"
redundant_clone = "warn"

[workspace.lints.rust]
missing_debug_implementations = "warn"
missing_docs = "warn"
rust_2018_idioms = "warn"
unreachable_pub = "warn"
unused_must_use = "warn"

[workspace.dependencies]
op-evm2 = { path = "crates/op", default-features = false }
base-evm2 = { path = "crates/base", default-features = false }
monad-evm2 = { path = "crates/monad", default-features = false }
arbitrum = { path = "crates/arbitrum", default-features = false }

# evm2: keep in lockstep with the Tempo evm2 integration (tempoxyz/tempo#7871) so every network
# shares one `evm2` crate graph in Foundry.
evm2 = { git = "https://github.com/mablr/evm2", rev = "64785b94b5697f6d4bb9f03d9884dd4cf0356cf2", default-features = false, features = ["std"] }
evm2-macros = { git = "https://github.com/mablr/evm2", rev = "64785b94b5697f6d4bb9f03d9884dd4cf0356cf2" }

# alloy: match Foundry's versions.
alloy-consensus = { version = "2.5.0", default-features = false }
alloy-eips = { version = "2.5.0", default-features = false }
alloy-primitives = { version = "1.7.0", default-features = false }
alloy-rlp = { version = "0.3", default-features = false }
alloy-sol-types = { version = "1.7.0", default-features = false }

# misc
auto_impl = "1"
derive_more = { version = "2", default-features = false }
thiserror = { version = "2", default-features = false }
