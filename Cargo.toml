[workspace]
members = ["crates/op", "crates/base", "crates/monad"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
authors = ["Foundry Contributors"]
license = "MIT OR Apache-2.0"
homepage = "https://getfoundry.sh"
repository = "https://github.com/foundry-rs/evm2-networks"
keywords = ["evm", "evm2", "ethereum", "execution"]
categories = ["cryptography::cryptocurrencies"]
publish = false

[workspace.lints.clippy]
dbg_macro = "warn"
manual_string_new = "warn"
uninlined_format_args = "warn"
use_self = "warn"
redundant_clone = "warn"

[workspace.lints.rust]
missing_debug_implementations = "warn"
missing_docs = "warn"
rust_2018_idioms = "warn"
unreachable_pub = "warn"
unused_must_use = "warn"

[workspace.dependencies]
# evm2: keep in lockstep with the Tempo evm2 integration (tempoxyz/tempo#7871) so every network
# shares one `evm2` crate graph in Foundry.
evm2 = { git = "https://github.com/alloy-rs/evm2", rev = "a29a283f6cd4bc65e44f5813de5e9f43553c5fda", default-features = false, features = ["std"] }
evm2-macros = { git = "https://github.com/alloy-rs/evm2", rev = "a29a283f6cd4bc65e44f5813de5e9f43553c5fda" }

# alloy: match Foundry's versions.
alloy-consensus = { version = "2.5.0", default-features = false }
alloy-eips = { version = "2.5.0", default-features = false }
alloy-primitives = { version = "1.7.0", default-features = false }
alloy-sol-types = { version = "1.7.0", default-features = false }

# misc
thiserror = { version = "2", default-features = false }
